# ng-runner-policy: private-jit-only-v1
name: Go
run-name: action:${{ inputs.action_tag }}:pool:${{ inputs.runner_pool_tag }}
on:
  workflow_dispatch:
    inputs:
      action_tag:
        type: choice
        options: [ci]
        required: true
      runner_pool_tag:
        type: choice
        options: [private]
        required: true
permissions:
  contents: read
concurrency:
  group: go-backport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  go126:
    name: Go 1.26 compatibility
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-go-jose-v3","ng-main-run-{0}","gha-{0}-go126"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.x
          cache: false
      - run: go test -race ./...
  go127:
    name: Go 1.27 compatibility
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-go-jose-v3","ng-main-run-{0}","gha-{0}-go127"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.x
          cache: false
      - run: go test -race ./...
  govulncheck:
    name: Reachable vulnerability check
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-go-jose-v3","ng-main-run-{0}","gha-{0}-govulncheck"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.x
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
